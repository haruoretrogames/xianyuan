<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>仙緣對決｜仙劍卡牌對戰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

<!-- ======== START ======== -->
<section id="scrStart" class="screen">
  <div class="title">
    <h1 class="logo"><span class="logo-img ci-logo" role="img" aria-label="仙劍奇俠傳 仙緣對決"></span></h1>
    <p>哈魯歐的仙劍卡牌桌遊｜與電腦對戰</p>
  </div>
  <div class="menu">
    <div>
      <div class="lbl">電腦難度</div>
      <div class="seg" id="diffSeg">
        <button data-d="easy">簡單</button><button data-d="normal" class="on">普通</button><button data-d="hard">困難</button>
      </div>
    </div>
    <div>
      <div class="lbl">規則版本</div>
      <div class="seg" id="verSeg">
        <button data-v="v04" class="on">V0.4</button><button data-v="v03">V0.3</button><button data-v="bal">平衡建議版</button>
      </div>
    </div>
    <button class="btn primary" id="btnDraft">與電腦對戰</button>
    <button class="btn primary jade" id="btnOnline">連線對戰（兩台裝置）</button>
    <button class="btn ghost" data-act="rules">規則速查</button>
  </div>
  <div class="foot">同人桌遊試玩設計，技能效果與數值為桌遊改編，非原作數據。</div>
</section>

<!-- ======== DRAFT ======== -->
<section id="scrDraft" class="screen" hidden>
  <div class="h2">選角</div>
  <p class="sub" id="draftInfo"></p>
  <div class="order" id="draftOrder"></div>
  <div class="picks"><div><b>我方</b><span id="pkMe">—</span></div><div><b id="pkAiLbl">電腦</b><span id="pkAi">—</span></div></div>
  <div class="dgrid" id="draftGrid"></div>
</section>

<!-- ======== ONLINE LOBBY ======== -->
<section id="scrOnline" class="screen" hidden>
  <div class="h2">連線對戰</div>
  <p class="sub">兩台裝置各自打開這個網站：一方建立房間，另一方輸入房間代碼加入。<br>規則版本：<b id="olRule">V0.4</b>（以房主的設定為準）</p>
  <div class="menu ol">
    <div class="olbox">
      <div class="olt">我要開房</div>
      <button class="btn primary" id="btnHost">建立房間</button>
      <p class="olmsg" id="hostErr"></p>
      <div id="hostInfo" hidden>
        <div class="lbl">房間代碼</div>
        <div class="code" id="roomCode">-----</div>
        <div class="row2"><button class="btn" id="btnCopyCode">複製代碼</button><button class="btn" id="btnCopyLink">複製邀請連結</button></div>
        <p class="olmsg" id="hostMsg"></p>
      </div>
    </div>
    <div class="olbox">
      <div class="olt">我要加入</div>
      <div class="row2"><input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入 5 碼代碼"><button class="btn primary" id="btnJoin">加入</button></div>
      <p class="olmsg" id="joinMsg"></p>
    </div>
    <button class="btn ghost" id="btnOlBack">返回</button>
  </div>
</section>

<!-- ======== GAME ======== -->
<section id="scrGame" class="screen" hidden>
  <div class="top">
    <div class="t">仙緣對決 <small id="verTag" style="font-size:11px;color:#b9a988;letter-spacing:0"></small></div>
    <button data-act="rules">規則</button>
    <button data-act="menu" id="btnMenu">選單</button>
  </div>
  <div class="glay">
    <div class="gmain">
      <div class="side ai" id="sideAI"></div>
      <div class="prompt" id="prompt"></div>
      <div class="side me" id="sideMe"></div>
    </div>
    <div class="gside">
      <div class="status" id="status"></div>
      <div class="handwrap">
        <div class="handhd">我的手牌 <span id="handInfo"></span></div>
        <div class="hand" id="hand"></div>
      </div>
      <div class="ticker"><span class="last" id="lastLog"></span><button data-act="log" id="btnLog">戰鬥紀錄</button></div>
      <div class="logbox" id="logBox" hidden></div>
    </div>
  </div>
  <div id="panel"></div>
</section>

</div>
<div class="banner" id="banner"></div>
<div id="modal"></div>
<div id="cardpop"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
